<!doctype html>
<!--
  Source of icon.png (256x256, rendered at 1x): the registry icon, shown in
  plugin search results and on the plugin page. The registry wants exactly
  256x256 and at most 128 KB. Same language as banner.source.html: the
  base-50 ground, faint ink waves, and EmDash's gradient on the one wave
  that carries meaning, here a rising traffic line. No text, so no webfont,
  and the registry rounds the corners itself.

  Render from this folder:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=256,256 \
      --screenshot="$PWD/icon.png" "file://$PWD/icon.source.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --base-50:  oklch(3.5%  0.006 264);
    --base-900: oklch(99%   0.018 102);
  }
  * { margin: 0; padding: 0; }
  html, body { width: 256px; height: 256px; overflow: hidden; background: var(--base-50); }
  svg { display: block; width: 256px; height: 256px; }
  .ink { color: var(--base-900); opacity: 0.16; }
</style>
</head>
<body>
  <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="emdash-wave" x1="36" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#281A81" />
        <stop offset="0.22" stop-color="#911475" />
        <stop offset="0.42" stop-color="#CE2F55" />
        <stop offset="0.6" stop-color="#FF6633" />
        <stop offset="0.8" stop-color="#FBAD41" />
        <stop offset="1" stop-color="#FFE9CB" />
      </linearGradient>
      <linearGradient id="area" x1="0" y1="80" x2="0" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FF6633" stop-opacity="0.28" />
        <stop offset="1" stop-color="#FF6633" stop-opacity="0" />
      </linearGradient>
    </defs>
    <g class="ink" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M -10,70 C 30,58 60,84 100,78 C 140,72 170,52 210,58 C 236,62 252,72 270,70" />
      <path d="M -10,214 C 30,204 60,226 100,220 C 140,214 170,198 210,204 C 236,208 252,216 270,214" />
    </g>
    <path fill="url(#area)"
      d="M 36,176 C 58,170 66,150 86,154 C 106,158 112,174 132,164 C 152,154 158,118 180,112 C 196,108 206,94 220,84 L 220,200 L 36,200 Z" />
    <path fill="none" stroke="url(#emdash-wave)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
      d="M 36,176 C 58,170 66,150 86,154 C 106,158 112,174 132,164 C 152,154 158,118 180,112 C 196,108 206,94 220,84" />
    <circle cx="220" cy="84" r="11" fill="#FFE9CB" />
  </svg>
</body>
</html>

<!doctype html>
<!--
  Source of icon.png (256x256, rendered at 1x): the registry icon, shown in
  plugin search results and on the plugin page. The registry wants exactly
  256x256 and at most 128 KB. It sits at about 50 px among flat, solid
  tiles with one thick glyph, so this is one too: EmDash's gradient as the
  ground and a white trend line. No text, so no webfont, and the registry
  rounds the corners itself.

  Render from this folder:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=256,256 \
      --screenshot="$PWD/icon.png" "file://$PWD/icon.source.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 256px; height: 256px; overflow: hidden; }
  svg { display: block; width: 256px; height: 256px; }
</style>
</head>
<body>
  <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="emdash" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#281A81" />
        <stop offset="0.3" stop-color="#911475" />
        <stop offset="0.55" stop-color="#CE2F55" />
        <stop offset="0.8" stop-color="#FF6633" />
        <stop offset="1" stop-color="#FBAD41" />
      </linearGradient>
    </defs>
    <rect width="256" height="256" fill="url(#emdash)" />
    <path d="M 44,186 L 96,128 L 138,158 L 210,76" fill="none" stroke="#fff"
      stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="210" cy="76" r="22" fill="#fff" />
  </svg>
</body>
</html>
